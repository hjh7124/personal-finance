# ─────────────────────────────────────────────────────────────
# 기본 프로필
#
# ⚠ 아래 세 줄은 본인 값으로 채워야 계산이 의미를 가집니다.
#   resignation_date / target_runway_months / emergency_reserve
# ─────────────────────────────────────────────────────────────

# 마지막 근무일. 행정 기한(실업급여·건강보험 등) 계산의 기준점입니다.
# 비워두면 기한 알림만 꺼지고 나머지 기능은 정상 동작합니다.
resignation_date: null

# 계산 기준월. null이면 오늘 날짜 기준.
as_of: null

currency: KRW
household_size: 1

# 최소한 확보하고 싶은 런웨이(개월). 이 밑으로 내려가면 경고가 뜹니다.
target_runway_months: 12

# 비상금: 런웨이 재원에서 빼두고 끝까지 손대지 않을 금액.
# 런웨이는 "이 금액을 남긴 채로" 몇 개월 버티는지를 셉니다.
emergency_reserve: 0

# 최근 실지출 평균을 낼 때 사용할 개월 수.
# 기록이 한 달치뿐이면 그 한 달이 그대로 기준이 됩니다.
burn_window_months: 3
