# ─────────────────────────────────────────────────────────────
# 기본 프로필
#
# ⚠ 아래 세 줄은 본인 값으로 채워야 계산이 의미를 가집니다.
#   resignation_date / target_runway_months / emergency_reserve
# ─────────────────────────────────────────────────────────────

# 마지막 근무일. 행정 기한(실업급여·건강보험 등) 계산의 기준점입니다.
resignation_date: 2026-07-31

# 계산 기준월. null이면 오늘 날짜 기준.
as_of: null

currency: KRW
household_size: 1

# 최소한 확보하고 싶은 런웨이(개월). 이 밑으로 내려가면 경고가 뜹니다.
target_runway_months: 12

# 비상금: 런웨이 재원에서 빼두고 끝까지 손대지 않을 금액.
# 런웨이는 "이 금액을 남긴 채로" 몇 개월 버티는지를 셉니다.
emergency_reserve: 0

# 최근 실지출 평균을 낼 때 사용할 개월 수.
# 기록이 한 달치뿐이면 그 한 달이 그대로 기준이 됩니다.
burn_window_months: 3

# ─────────────────────────────────────────────────────────────
# 앞으로의 조정
#
# 기록 평균에는 남아 있지만 앞으로는 안 나갈 돈(끝난 구독), 또는
# 아직 기록에 없지만 곧 나갈 돈(새 보험료)을 여기서 더하고 뺍니다.
# 과거 기록을 고쳐서 맞추면 그 달의 진실이 사라지므로, 과거는 그대로
# 두고 '앞으로'만 조정합니다.
#
# 새 달의 기록이 쌓여 평균에 자연히 반영되면 해당 항목을 지우세요.
# ─────────────────────────────────────────────────────────────
burn_adjustments:
  - name: 클로드 맥스·토큰 (9월부터 법인 비용)
    amount: -161_227
    note: >
      8월 평균에는 들어 있지만 9월부터 개인 지출에서는 빠집니다.
      9월 기록이 쌓이면 이 항목을 지우면 됩니다.

  # 건강보험 지역가입 보험료가 확정되면 여기에 +금액으로 넣으세요.
  # - name: 건강보험 지역가입 보험료
  #   amount: 0
