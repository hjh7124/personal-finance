# ─────────────────────────────────────────────────────────────
# 계좌·자산 정의  ─  본인 계좌에 맞게 이름을 바꾸고, 없는 항목은 지우세요.
#
# type      : cash(현금성) | deposit(예적금) | investment(투자) |
#             pension(연금) | real_estate(부동산) | debt(부채)
# liquidity : instant(즉시 인출) | short(1개월 내 현금화) |
#             long(손실·해지비용 감수하면 가능) | locked(사실상 불가)
#
# 런웨이 1차 재원 = instant + short
# 런웨이 2차 재원 = 여기에 long 까지 포함
# locked(연금·보증금 등)는 어떤 경우에도 런웨이에 넣지 않습니다.
# 부채는 잔액을 양수로 기록하면 순자산에서 자동으로 차감됩니다.
# ─────────────────────────────────────────────────────────────
accounts:
  - id: main_checking
    name: 주거래 입출금통장
    type: cash
    liquidity: instant

  - id: parking
    name: 파킹통장·CMA
    type: cash
    liquidity: instant

  - id: savings
    name: 예적금
    type: deposit
    liquidity: short
    note: 중도해지 시 이자만 손실

  - id: investment
    name: 주식·ETF 계좌
    type: investment
    liquidity: long
    note: 손실 구간엔 팔지 않는다. 2차 재원

  - id: irp
    name: IRP (퇴직금 계좌)
    type: pension
    liquidity: locked
    note: 중도인출 시 기타소득세 16.5%

  - id: pension_savings
    name: 연금저축
    type: pension
    liquidity: locked

  - id: housing_deposit
    name: 보증금·부동산
    type: real_estate
    liquidity: locked

  - id: student_loan
    name: 학자금대출 잔액
    type: debt
    liquidity: locked

  - id: other_loan
    name: 기타 대출 잔액
    type: debt
    liquidity: locked
