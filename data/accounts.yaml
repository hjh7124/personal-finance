# ─────────────────────────────────────────────────────────────
# 계좌·자산 정의
#
# 기존 자산관리 포트폴리오 시트의 계좌 구조를 옮겨온 것이다.
# 그 시트의 데이터는 2025년 9월 기준이라 잔액은 반드시 다시 확인할 것.
# 잔액은 여기가 아니라 balances.csv(드라이브의 '잔액기록' 시트)에 넣는다.
#
# type      : cash(현금성) | deposit(예적금) | investment(투자) |
#             pension(연금) | real_estate(부동산) | debt(부채)
# liquidity : instant(즉시 인출) | short(1개월 내 현금화) |
#             long(손실·해지비용 감수하면 가능) | locked(사실상 불가)
#
# 런웨이 1차 재원 = instant + short
# 런웨이 2차 재원 = 여기에 long 까지 포함
# locked(연금 등)는 어떤 경우에도 런웨이에 넣지 않는다.
# 부채는 잔액을 양수로 기록하면 순자산에서 자동으로 차감된다.
# ─────────────────────────────────────────────────────────────
accounts:
  - id: woori
    name: 우리은행
    type: cash
    liquidity: instant

  - id: toss_bank
    name: 토스뱅크
    type: cash
    liquidity: instant

  - id: kakao_bank
    name: 카카오뱅크
    type: cash
    liquidity: instant

  - id: shinhan_savings
    name: 신한 적금
    type: deposit
    liquidity: short
    note: 만기 2030-01 · 중도해지해도 원금은 보존, 이자만 손실

  - id: stock_account
    name: 주식·ETF 계좌
    type: investment
    liquidity: long
    note: 토스증권+신한투자+미래에셋 합산. 손실 구간엔 팔지 않는다

  - id: housing_subscription
    name: 주택청약저축
    type: deposit
    liquidity: long
    note: 월 100,000원 납입 중. 해지하면 청약 자격을 잃으므로 2차 재원으로만 계산

  - id: irp
    name: IRP (퇴직금 계좌)
    type: pension
    liquidity: locked
    note: 중도인출 시 기타소득세 16.5%. 런웨이에서 제외

  - id: pension_savings
    name: 연금저축
    type: pension
    liquidity: locked

  - id: housing_deposit
    name: 전세보증금
    type: real_estate
    liquidity: locked
    note: 계약 만기 전에는 현금화 불가

  - id: jeonse_loan
    name: 전세자금대출 잔액
    type: debt
    liquidity: locked
    note: 월 이자 282,650원. 금리 변동 조건과 만기를 확인할 것

  - id: student_loan
    name: 학자금대출 잔액
    type: debt
    liquidity: locked
    note: 소득 공백기 상환 유예 가능 여부를 한국장학재단에 확인할 것
