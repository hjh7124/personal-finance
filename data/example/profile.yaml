# ─────────────────────────────────────────────────────────────
# 기본 프로필  ─  전부 본인 값으로 교체하세요 (지금 값은 예시)
# ─────────────────────────────────────────────────────────────

# 마지막 근무일(퇴사일). 행정 기한 계산의 기준점입니다.
resignation_date: 2026-06-30

# 계산 기준월. 비워두면 오늘 날짜 기준으로 자동 설정됩니다.
as_of: null

currency: KRW
household_size: 1

# 최소한 확보하고 싶은 런웨이(개월). 이 밑으로 내려가면 경고가 뜹니다.
target_runway_months: 12

# 비상금: 런웨이 재원에서 빼두고 끝까지 손대지 않을 금액.
# 런웨이 계산은 "이 금액을 남긴 채로" 몇 개월 버티는지를 봅니다.
emergency_reserve: 5000000

# 최근 실지출 평균을 낼 때 사용할 개월 수
burn_window_months: 3
