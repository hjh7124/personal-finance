# ─────────────────────────────────────────────────────────────
# 업무 경비 예산
#
# period: monthly  매달 새로 채워지는 한도
#         total    프로젝트 전체에 한 번 주어진 금액
#
# 같은 금액이라도 둘은 읽는 법이 완전히 다릅니다.
# monthly 라면 한 달 64%는 한도 안이고,
# total 이라면 프로젝트 예산의 64%를 한 달에 쓴 것입니다.
# ─────────────────────────────────────────────────────────────
budgets:
  - id: site_costs
    name: 고양·정릉 현장 경비
    site: 고양
    amount: 1_000_000
    period: monthly
    start: 2026-08
