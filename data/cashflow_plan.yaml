# ─────────────────────────────────────────────────────────────
# 앞으로 들어올 돈 / 나갈 돈 (예정)
#
# 여기 적는 것은 "미래 계획"입니다.
# 이미 쓴 돈은 data/expenses.csv 에 기록합니다.
# ─────────────────────────────────────────────────────────────

incomes:
  # confidence: confirmed(확정) | expected(예상) | optimistic(되면 좋고)
  #
  # - id: unemployment_benefit
  #   name: 구직급여(실업급여)
  #   amount: 1_890_000
  #   start: 2026-09
  #   end: 2027-02
  #   confidence: expected
  []

scheduled_expenses:
  # 매달은 아니지만 시점과 금액을 아는 큰 지출.
  #
  # ⚠ 매달 나가는 고정비는 expenses.csv 의 kind: fixed 로 이미 잡히므로
  #    여기 또 적으면 이중 계산됩니다.

  # ── 이미 확정된 할부 잔여분 ────────────────────────────────
  # 8월에 1회차를 냈고(expenses.csv 에 irregular 로 기록됨),
  # 9월·10월에 같은 금액이 자동으로 빠져나갑니다. 이미 쓴 돈입니다.
  - id: installment_clothing
    name: 아울렛 할부 잔여 (3개월 중 2·3회차)
    amount: 531_700
    months: [2026-09, 2026-10]
    note: 188,800 + 177,400 + 118,000 + 47,500 (4건)

  - id: installment_medical
    name: 마운자로 할부 잔여 (3개월 중 2·3회차)
    amount: 126_800
    months: [2026-09, 2026-10]

  # ── 아직 금액을 모르는 것 ──────────────────────────────────
  - id: health_insurance_local
    name: 건강보험 지역가입 보험료
    amount: 0
    months: []
    note: >
      9월에 첫 고지서가 나옵니다. 금액을 확인하면 여기 채우고,
      매달 나가는 것이므로 이후에는 expenses.csv 에 kind: fixed 로 기록하세요.

  - id: national_pension
    name: 국민연금 보험료
    amount: 0
    months: []
    note: 납부예외를 신청했다면 0, 임의가입을 택했다면 월 금액 입력

  - id: student_loan_repayment
    name: 학자금 의무상환액 (연 1회)
    amount: 334_060
    months: [2027-05]
    note: >
      취업 후 상환 학자금은 종합소득세 신고 시 의무상환액이 산정·부과된다.
      매달 나가는 고정비가 아니라 1년에 한 번 오는 목돈이므로 소진 속도
      평균에서 빼고 여기에 시점을 지정해 둔다. 금액은 2026년 소득에 따라
      달라지므로 고지서를 받으면 실제 값으로 교체할 것.
      (2026-08 납부분 334,060원을 임시로 넣어둠)

  - id: income_tax_filing
    name: 종합소득세 신고 (2026년 근로소득 정산분)
    amount: 0
    months: [2027-05]
    note: >
      연중 퇴사라 연말정산을 못 했다면 2027년 5월에 직접 신고.
      보통 환급이 나오므로 확정되면 incomes 쪽으로 옮겨도 됩니다.
